version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use $VERSION_NODE_22
        - node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 12)) { console.error("Node.js 22.12 or newer is required"); process.exit(1); }'
        - npm ci
    build:
      commands:
        - npm run lint
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
